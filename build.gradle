plugins {
    id 'java'
    id 'application'
    id 'org.openapi.generator' version '7.14.0'
    id 'jacoco'
}

// Read version from properties file
def versionProperties = new Properties()
file('version.properties').withInputStream { versionProperties.load(it) }
def baseVersion = versionProperties.getProperty('version', '1.0.0')
def isSnapshot = versionProperties.getProperty('snapshot', 'true').toBoolean()
version = isSnapshot ? "${baseVersion}-SNAPSHOT" : baseVersion

application {
    mainClass = 'org.giwi.nifi.tester.PipelineTester'
}

group = 'org.giwi'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-json:3.4.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'
    implementation 'org.openapitools:openapi-generator:7.14.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.10'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers:1.19.7'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
    generatorName = "java"
    inputSpec = "./openapi/swagger.yaml"
    outputDir = "$buildDir/generated/java-client"
    apiPackage = "org.giwi.nifi.tester.api"
    invokerPackage = "org.giwi.nifi.tester.invoker"
    modelPackage = "org.giwi.nifi.tester.model"
    library = "resttemplate"
    skipValidateSpec = true
    configOptions = [
        dateLibrary: "java8",
        useJackson3: "true"
    ]
    globalProperties = [
        modelDocs: "false",
        apiDocs: "false"
    ]
}

test {
    useJUnitPlatform()

    // Show test results in console
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true
    }

    // JaCoCo test coverage
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            element = 'CLASS'
            includes = ['org.giwi.nifi.tester.PipelineConverter',
                        'org.giwi.nifi.tester.PipelineValidator',
                        'org.giwi.nifi.tester.PipelineTester']
            limit {
                minimum = 0.80
            }
        }
    }
}

task integrationTest(type: Test) {
    useJUnitPlatform()
    include '**/*IntegrationTest.class'
    shouldRunAfter test

    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showExceptions true
        exceptionFormat "full"
    }
}