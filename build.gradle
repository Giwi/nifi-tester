plugins {
    id 'java'
    id 'org.openapi.generator' version '7.14.0'
}

group = 'org.giwi'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web:3.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-json:3.4.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'
    implementation 'org.openapitools:openapi-generator:7.14.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.10'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers:1.19.7'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openApiGenerate {
    generatorName = "java"
    inputSpec = "./openapi/swagger.yaml"
    outputDir = "$buildDir/generated/java-client"
    apiPackage = "org.giwi.nifi.client.api"
    invokerPackage = "org.giwi.nifi.client.invoker"
    modelPackage = "org.giwi.nifi.client.model"
    library = "resttemplate"
    skipValidateSpec = true
    configOptions = [
        dateLibrary: "java8",
        useJackson3: "true"
    ]
    globalProperties = [
        modelDocs: "false",
        apiDocs: "false"
    ]
}

test {
    useJUnitPlatform()
    // Exclude integration tests from standard test run
    exclude '**/*IntegrationTest.class'
}

task integrationTest(type: Test) {
    useJUnitPlatform()
    include '**/*IntegrationTest.class'
    shouldRunAfter test
}