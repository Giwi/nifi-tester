name: Groovy Script Pipeline
description: A pipeline that uses Groovy script to append 'world' to 'hello'
parentGroupId: root

inputPorts:
  - name: Input
    x: 100
    y: 100

processors:
  - name: AppendWorld
    type: org.apache.nifi.processors.groovyx.ExecuteGroovyScript
    x: 400
    y: 100
    schedulingStrategy: TIMER_DRIVEN
    schedulingPeriod: "1 sec"
    properties:
      Script Body: |
        import org.apache.nifi.flowfile.FlowFile
        import java.nio.charset.StandardCharsets
        
        FlowFile flowFile = session.get()
        if (flowFile != null) {
            String content = ""
            session.read(flowFile, { inputStream ->
                content = new String(inputStream.readAllBytes(), StandardCharsets.UTF_8)
            })
            content = content + " world"
            flowFile = session.write(flowFile, { outputStream ->
                outputStream.write(content.getBytes(StandardCharsets.UTF_8))
            })
            session.transfer(flowFile, REL_SUCCESS)
        }

  - name: LogResult
    type: org.apache.nifi.processors.standard.LogAttribute
    x: 700
    y: 100
    schedulingStrategy: TIMER_DRIVEN
    schedulingPeriod: "1 sec"
    properties:
      Log Level: info
      Log Prefix: "Result: "
    autoTerminatedRelationships:
      - success

connections:
  - name: Input to Groovy
    sourceId: ${Input}
    destinationId: ${AppendWorld}
    x: 250
    y: 100

  - name: Groovy to Log
    sourceId: ${AppendWorld}
    destinationId: ${LogResult}
    relationships:
      - success
    x: 550
    y: 100
